<polyline points="800,610 800,685" fill="none" stroke="#2874B2" stroke-width="3" stroke-linejoin="round"/>
<polygon points="800.0,685.0 794.0,674.6 806.0,674.6" fill="#2874B2"/>
<polyline points="560,745 320,745 320,875" fill="none" stroke="#2874B2" stroke-width="3" stroke-linejoin="round"/>
