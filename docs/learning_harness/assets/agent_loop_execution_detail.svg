<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1530" viewBox="0 0 1600 1530" role="img"><title>Agent loop 模块展开</title><desc>同一 run 内保持消息与回执配对；结束等待学生后，下一次请求会建立新的运行</desc><rect width="100%" height="100%" fill="#FAFCFE"/>
<text x="50.0" y="68.2" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="36" font-weight="700" fill="#183047">Agent loop 模块展开</text>
<text x="52.0" y="110.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" fill="#52687A">同一 run 内保持消息与回执配对；结束等待学生后，下一次请求会建立新的运行</text>
<rect x="50" y="150" width="1500" height="1310" rx="22" fill="#EFF6FD" stroke="#8EB6D6" stroke-width="3"/>
<polyline points="800,260 800,320" fill="none" stroke="#2874B2" stroke-width="3" stroke-linejoin="round"/>
